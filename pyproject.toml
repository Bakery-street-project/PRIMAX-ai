[project]
name = "primax-ai"
version = "1.0.0"
description = "PRIMAX AI - Neuromorphic Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "asyncpg>=0.29.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sympy>=1.12",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "groq>=0.4.0",
    "textual>=0.50.0",
    "ollama>=0.3.0",
    "mcp>=1.0.0",
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.uv]
dev-dependencies = ["pytest>=7.0", "pytest-asyncio>=0.21"]
