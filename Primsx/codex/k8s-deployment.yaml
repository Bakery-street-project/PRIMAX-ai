apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-ai-coder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-ai-coder
  template:
    metadata:
      labels:
        app: go-ai-coder
    spec:
      containers:
      - name: go-ai-coder
        image: gcr.io/YOUR_PROJECT/go-ai-coder:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-ai-coder-svc
spec:
  type: LoadBalancer
  selector:
    app: go-ai-coder
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
