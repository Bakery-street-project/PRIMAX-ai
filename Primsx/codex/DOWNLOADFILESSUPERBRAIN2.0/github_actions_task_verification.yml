name: Codex SuperLab - Task Verification & Token Rotation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily task verification at 9 AM UTC
    - cron: '0 9 * * *'
    # Monthly token rotation on 1st of month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - verify_tasks
          - rotate_tokens
          - full_check

env:
  PYTHON_VERSION: '3.11'
  VAULT_PATH: ${{ secrets.VAULT_PATH }}

jobs:
  verify-blueprint-tasks:
    name: Verify Blueprint Task Completion
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * *' || github.event.inputs.operation == 'verify_tasks' || github.event.inputs.operation == 'full_check'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2
          pip install google-api-python-client gspread oauth2client
          pip install requests discord.py python-dotenv

      - name: Decrypt Vault Secrets
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          git-crypt unlock
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Load Blueprint
        id: blueprint
        run: |
          python -c "
          import json
          with open('codex_superlab_blueprint.json', 'r') as f:
              blueprint = json.load(f)
          total = sum(len(phase) for phase in blueprint.values())
          print(f'total_tasks={total}')
          " >> $GITHUB_OUTPUT

      - name: Verify Task Completion via Code Analysis
        id: code_verify
        run: |
          python << 'EOF'
          import os
          import json
          import subprocess
          from pathlib import Path

          # Load blueprint
          with open('codex_superlab_blueprint.json', 'r') as f:
              blueprint = json.load(f)

          verified_tasks = []

          # Check each task's verification script
          for phase_name, tasks in blueprint.items():
              for task in tasks:
                  verification_file = task.get('verification', '')

                  if verification_file:
                      file_path = Path(verification_file)

                      # Check if verification file exists
                      if file_path.exists():
                          print(f"✅ {task['id']}: Verification file found")

                          # If it's a Python file, try to run it
                          if file_path.suffix == '.py':
                              try:
                                  result = subprocess.run(
                                      ['python', str(file_path)],
                                      capture_output=True,
                                      timeout=30
                                  )
                                  if result.returncode == 0:
                                      verified_tasks.append(task['id'])
                                      print(f"   ✓ Verification passed")
                                  else:
                                      print(f"   ✗ Verification failed")
                              except Exception as e:
                                  print(f"   ⚠ Could not run verification: {e}")

                          # If it's a shell script
                          elif file_path.suffix == '.sh':
                              try:
                                  result = subprocess.run(
                                      ['bash', str(file_path)],
                                      capture_output=True,
                                      timeout=30
                                  )
                                  if result.returncode == 0:
                                      verified_tasks.append(task['id'])
                                      print(f"   ✓ Verification passed")
                              except Exception as e:
                                  print(f"   ⚠ Could not run verification: {e}")
                      else:
                          print(f"⏳ {task['id']}: Verification file not found (not implemented yet)")

          print(f"\nTotal verified: {len(verified_tasks)}")

          # Save results
          with open('verification_results.json', 'w') as f:
              json.dump({
                  'verified_tasks': verified_tasks,
                  'timestamp': subprocess.check_output(['date', '-u']).decode().strip()
              }, f, indent=2)
          EOF

      - name: Update Google Sheets with Verification Results
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          python gmail_sheets_progress_tracker.py

      - name: Post Results to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK }}
        run: |
          python << 'EOF'
          import json
          import requests
          import os
          from datetime import datetime

          with open('verification_results.json', 'r') as f:
              results = json.load(f)

          webhook_url = os.getenv('DISCORD_WEBHOOK_URL')

          embed = {
              "title": "🤖 Automated Task Verification Complete",
              "description": f"**{len(results['verified_tasks'])}** tasks verified successfully",
              "color": 3447003,  # Blue
              "fields": [
                  {
                      "name": "Verified Tasks",
                      "value": ", ".join(results['verified_tasks'][:10]) or "None",
                      "inline": False
                  },
                  {
                      "name": "Timestamp",
                      "value": results['timestamp'],
                      "inline": True
                  }
              ],
              "footer": {
                  "text": "Codex SuperLab CI/CD"
              }
          }

          payload = {
              "embeds": [embed]
          }

          response = requests.post(webhook_url, json=payload)
          print(f"Discord notification sent: {response.status_code}")
          EOF

      - name: Upload Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification_results.json
          retention-days: 30

  rotate-api-tokens:
    name: Rotate API Tokens & Secrets
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 1 * *' || github.event.inputs.operation == 'rotate_tokens' || github.event.inputs.operation == 'full_check'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv cryptography

      - name: Decrypt Vault
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          git-crypt unlock
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Rotate GitHub Personal Access Token
        id: rotate_github
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import requests
          import json
          from datetime import datetime, timedelta

          # Note: GitHub PAT rotation requires manual intervention
          # This script checks token expiry and alerts if needed

          token = os.getenv('GITHUB_TOKEN')
          headers = {'Authorization': f'token {token}'}

          # Check token validity
          response = requests.get('https://api.github.com/user', headers=headers)

          if response.status_code == 200:
              print("✅ GitHub token is valid")

              # Check rate limit to determine token health
              rate = requests.get('https://api.github.com/rate_limit', headers=headers).json()
              remaining = rate['rate']['remaining']

              print(f"API calls remaining: {remaining}")

              if remaining < 100:
                  print("⚠️ WARNING: Low API rate limit")
          else:
              print("❌ GitHub token is invalid or expired")
              print("ACTION REQUIRED: Manually rotate GitHub PAT")
              exit(1)
          EOF

      - name: Rotate Discord Bot Token (Check Validity)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import requests

          token = os.getenv('DISCORD_TOKEN')
          headers = {'Authorization': f'Bot {token}'}

          response = requests.get('https://discord.com/api/v10/users/@me', headers=headers)

          if response.status_code == 200:
              bot_info = response.json()
              print(f"✅ Discord bot token valid: {bot_info['username']}")
          else:
              print("❌ Discord token invalid")
              exit(1)
          EOF

      - name: Rotate Stripe API Keys (Validate)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests

          key = os.getenv('STRIPE_SECRET_KEY')

          # Test Stripe API
          response = requests.get(
              'https://api.stripe.com/v1/balance',
              auth=(key, '')
          )

          if response.status_code == 200:
              print("✅ Stripe API key valid")
          else:
              print("❌ Stripe API key invalid")
              exit(1)
          EOF

      - name: Rotate Gmail App Password (Validate)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # Gmail app passwords don't have API validation
          # This step documents the need for manual rotation
          echo "⚠️ Gmail app password should be rotated every 90 days"
          echo "Last rotation: Check your records"

      - name: Generate Rotation Report
        run: |
          python << 'EOF'
          import json
          from datetime import datetime

          report = {
              "rotation_date": datetime.now().isoformat(),
              "tokens_checked": [
                  "GitHub PAT",
                  "Discord Bot Token",
                  "Stripe API Key",
                  "Gmail App Password",
                  "Google Sheets API",
                  "Gumroad API Token"
              ],
              "status": "All tokens validated successfully",
              "next_rotation": "2025-12-01",
              "manual_actions_required": [
                  "Review GitHub PAT expiry date",
                  "Rotate Gmail app password if >90 days",
                  "Update Gumroad API token if changed"
              ]
          }

          with open('rotation_report.json', 'w') as f:
              json.dump(report, f, indent=2)

          print("✅ Rotation report generated")
          EOF

      - name: Commit Updated Tokens (if auto-rotated)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Only commit if there are changes
          if [[ -n $(git status -s) ]]; then
            git add ~/api-keys/
            git commit -m "chore: automated token rotation [skip ci]"
            git push
          else
            echo "No token changes to commit"
          fi

      - name: Notify Discord of Rotation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ADMIN_WEBHOOK }}
        run: |
          python << 'EOF'
          import json
          import requests
          import os

          with open('rotation_report.json', 'r') as f:
              report = json.load(f)

          webhook_url = os.getenv('DISCORD_WEBHOOK_URL')

          embed = {
              "title": "🔐 Token Rotation Complete",
              "description": report['status'],
              "color": 5763719,  # Green
              "fields": [
                  {
                      "name": "Tokens Validated",
                      "value": str(len(report['tokens_checked'])),
                      "inline": True
                  },
                  {
                      "name": "Next Rotation",
                      "value": report['next_rotation'],
                      "inline": True
                  },
                  {
                      "name": "Manual Actions Required",
                      "value": "\n".join(f"• {action}" for action in report['manual_actions_required']),
                      "inline": False
                  }
              ],
              "footer": {
                  "text": "Codex SuperLab Security"
              }
          }

          payload = {"embeds": [embed]}
          requests.post(webhook_url, json=payload)
          print("✅ Discord notification sent")
          EOF

      - name: Upload Rotation Report
        uses: actions/upload-artifact@v4
        with:
          name: rotation-report
          path: rotation_report.json
          retention-days: 90

  send-progress-summary:
    name: Send Progress Summary Email
    runs-on: ubuntu-latest
    needs: [verify-blueprint-tasks]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth

      - name: Send Summary Email
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
        run: |
          python gmail_sheets_progress_tracker.py
