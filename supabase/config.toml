# A string used to distinguish different Supabase projects on the same host.
project_id = "primax-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = true

[functions.read-api-keys]
verify_jwt = true

[functions.stripe-webhooks]
verify_jwt = false

[functions.primax-ai]
verify_jwt = true

[functions.ai-coach]
verify_jwt = true

[functions.get-secret]
verify_jwt = true
