services:
  - type: web
    name: primax-neuromorphic
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PRIMAX_API_KEY
        sync: false
      - key: WATERMARK
        value: PRIMAX-AI-BSP-2025
    healthCheckPath: /health
    autoDeploy: true
